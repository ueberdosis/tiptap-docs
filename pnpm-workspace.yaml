overrides:
  postcss: 'catalog:'
  glob: 14.0.2
  '@npmcli/map-workspaces>minimatch': 11.0.1
  '@typescript-eslint/typescript-estree>minimatch': 11.0.1
  '@tailwindcss/typography>postcss-selector-parser': 6.1.5

catalog:
  postcss: ^8.5.23

allowBuilds:
  es5-ext: true
  iframe-resizer: true
  sharp: true
  typesense-instantsearch-adapter: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.6'
  - '@next/eslint-plugin-next@16.3.6'
  - '@next/mdx@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - eslint-config-next@16.3.6
  - next@16.3.6
