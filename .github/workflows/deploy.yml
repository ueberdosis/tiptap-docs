# Automate, customize, and execute your software development workflows right in your repository with GitHub Actions.
# Documentation: https://docs.github.com/en/actions

name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - development
      - next
      - v2

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      # Lets the job request a GitHub Actions OIDC token, which authenticates it at the Tiptap Cloud app
      id-token: write

    steps:
      # GitLab is only reachable through our VPN, so the deployment is triggered through the
      # Tiptap Cloud app. It verifies the OIDC token and takes branch and commit from it.
      - name: Trigger build
        shell: bash
        run: |
          set -euo pipefail

          OIDC_TOKEN=$(curl \
            --fail \
            --silent \
            --show-error \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=collab-app-docs-deploy" \
            | jq -r '.value')
          echo "::add-mask::$OIDC_TOKEN"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            --header "Accept: application/json" \
            https://cloud.tiptap.dev/api/docs/deploy
