name: tests

on:
  pull_request:
  push:
    branches:
      - main
  # Vercel reports each finished deployment; the browser tests run against it.
  deployment_status:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.deployment.sha || github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Takes the pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Known URLs, redirects, sidebars and internal links; no server needed
      - run: pnpm test:structure

  browser:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
        env:
          # The deployment serves the docs under BASE_PATH, as tiptap.dev/docs does
          DOCS_TEST_URL: ${{ github.event.deployment_status.environment_url }}/docs
          # Lets the tests through Vercel's deployment protection, if it is on
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
