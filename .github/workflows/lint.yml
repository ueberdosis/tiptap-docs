name: lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Takes the pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@v4

      # pnpm 11 needs Node 22
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ESLint (code and MDX) and Prettier --check
      - run: pnpm lint
