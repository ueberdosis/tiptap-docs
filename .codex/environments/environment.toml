# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "tiptap-docs"

[setup]
script = '''
# Prepare an isolated Codex worktree for this pnpm/Next.js documentation site.
set -euo pipefail

project_root="$(git rev-parse --show-toplevel)"
cd "$project_root"

# Worktrees do not include ignored files. This project uses the primary
# worktree's local environment configuration in every Codex worktree.
primary_worktree="$(git worktree list --porcelain | awk '/^worktree / { print substr($0, 10); exit }')"
primary_env="$primary_worktree/.env"

if [[ "$project_root" != "$primary_worktree" ]]; then
  if [[ ! -f "$primary_env" ]]; then
    echo "Expected shared environment file is missing: $primary_env" >&2
    exit 1
  fi

  cp "$primary_env" .env
  echo 'Copied .env from the primary worktree.'
fi

# package.json pins pnpm, so Corepack selects the project version instead of a
# possibly incompatible globally installed version.
if command -v corepack >/dev/null 2>&1; then
  corepack pnpm install --frozen-lockfile
elif command -v pnpm >/dev/null 2>&1; then
  pnpm install --frozen-lockfile
else
  echo 'pnpm 11.24.0 (via Corepack) is required to set up this worktree.' >&2
  exit 1
fi'''
